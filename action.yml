name: 'GitHub Ripple'
description: 'Floating contributors on waves for your README'
author: 'coitloz88'
branding:
  icon: 'droplet'
  color: 'blue'
inputs:
  output-path:
    description: 'Where to write the SVG (relative to the consumer repo)'
    default: 'assets/ripple.svg'
  max-contributors:
    description: 'Max contributors shown'
    default: '20'
  exclude-bots:
    description: 'Exclude [bot] accounts (default false — bots appear as UFOs)'
    default: 'false'
  pins:
    description: 'Comma-separated synthetic contributors. Format: "login" or "login=avatar-url" (e.g. "claude=https://github.com/anthropics.png,jules")'
    default: ''
  token:
    description: 'GitHub token (defaults to github.token)'
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install pnpm
      uses: pnpm/action-setup@v4
      with:
        version: 10
    - name: Install deps
      run: pnpm install
      working-directory: ${{ github.action_path }}
      shell: bash
    - name: Generate SVG
      run: pnpm tsx scripts/generate.ts --owner="$OWNER" --repo="$REPO" --output="$OUTPUT" --max="$MAX" "$EXCLUDE_BOTS_FLAG" --pins="$PINS"
      working-directory: ${{ github.action_path }}
      shell: bash
      env:
        OWNER: ${{ github.repository_owner }}
        REPO: ${{ github.event.repository.name }}
        OUTPUT: ${{ github.workspace }}/${{ inputs.output-path }}
        MAX: ${{ inputs.max-contributors }}
        EXCLUDE_BOTS_FLAG: ${{ inputs.exclude-bots == 'true' && '--exclude-bots' || '--no-exclude-bots' }}
        PINS: ${{ inputs.pins }}
        GITHUB_TOKEN: ${{ inputs.token }}
